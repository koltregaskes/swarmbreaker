name: Session regression

on: [push, pull_request]

permissions:
  contents: read

jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pygame-ce==2.5.7
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
      - run: python tools/play_campaign_endings.py
